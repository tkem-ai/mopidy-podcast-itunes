[tox]
envlist = py,docs,ruff,ruff-format

[testenv]
# To use the distribution's python3-gi and python3-cairo instead of
# building PyGObject, run tox with VIRTUALENV_SYSTEM_SITE_PACKAGES=true
# or uncomment:
# system_site_packages = true
deps =
    pytest
    pytest-cov
    responses
commands =
    python -m pytest --basetemp={envtmpdir} --cov=mopidy_podcast_itunes --cov-branch --cov-report term-missing {posargs}

[testenv:docs]
deps =
     sphinx
commands =
     python -m sphinx -W -b html -d {envtmpdir}/doctrees docs {envtmpdir}/html

[testenv:pyright]
deps =
    pyright
    pytest
    responses
commands =
    pyright {posargs}

[testenv:ruff]
deps =
    ruff
commands =
    ruff check {posargs}

[testenv:ruff-format]
deps =
    ruff
commands =
    ruff format --diff -q {posargs}
